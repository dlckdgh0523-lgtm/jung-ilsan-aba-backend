# 주간 GEO 자동 측정 — 매주 월요일 KST 09:47, 리포트를 레포에 자동 커밋한다.
# 실패 정책: 시크릿 미등록만 건너뜀(경고). 그 외 실패(키 만료·잔액 소진·API 장애)는
#            리포트 커밋 후 워크플로를 빨간불로 종료한다 — 조용한 죽음 금지.
# 비용: 프롬프트 20개 × 반복 2회 (Haiku + 웹서치) — 회당 약 $0.6, 월 약 $2.6.
name: GEO Weekly Measure

on:
  schedule:
    - cron: '47 0 * * 1' # UTC 월 00:47 = KST 월 09:47
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run measurement
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEO_MEASURE_REPEAT: '2' # 노이즈 완화 — 프롬프트당 2회, 1회 이상 나오면 카운트(rule=any). 값 변경 = 축 변경이므로 고정할 것
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 이번 측정을 건너뜁니다. (Settings → Secrets → Actions에 등록)"
            echo "MEASURE_EXIT=skipped" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          npm run geo:measure
          code=$?
          set -e
          echo "MEASURE_EXIT=$code" >> "$GITHUB_ENV"

      - name: Commit report
        if: env.MEASURE_EXIT != 'skipped'
        run: |
          git config user.name "geo-measure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/geo-reports
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            # [skip ci]: GitHub Actions 재실행 방지 / [skip render]: Render 재배포 방지
            git commit -m "chore: 주간 GEO 자동 측정 리포트 [skip ci] [skip render]"
            git push
          fi

      - name: Fail on measurement errors
        if: env.MEASURE_EXIT != 'skipped' && env.MEASURE_EXIT != '0'
        run: |
          echo "::error::측정이 실패했습니다 (exit=$MEASURE_EXIT). API 키·잔액·Anthropic 상태를 확인하세요."
          exit 1
